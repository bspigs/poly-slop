name: Paper Market Scan

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Run keyless scanner
        run: python -m poly_agent.main --research 0
      - name: Run OpenAI research when configured
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            python -m poly_agent.main --provider openai --research 3
          else
            echo "OPENAI_API_KEY not set; cloud AI research skipped."
          fi
